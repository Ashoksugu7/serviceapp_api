services:
  api:
    build:
      context: .
    image: serviceops360-api:latest
    restart: unless-stopped
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in docker.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker.env}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-10s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15s}
      AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-15m}
      AUTH_EMAIL_FAILURE_LIMIT: ${AUTH_EMAIL_FAILURE_LIMIT:-5}
      AUTH_IP_FAILURE_LIMIT: ${AUTH_IP_FAILURE_LIMIT:-20}
    ports:
      - ${HTTP_PORT:-8080}:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  bootstrap-super-admin:
    image: serviceops360-api:latest
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in docker.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker.env}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
    entrypoint: ["/usr/local/bin/bootstrap-super-admin"]

  migrate:
    image: serviceops360-api:latest
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in docker.env}
    entrypoint: ["/app/scripts/migrate.sh"]
    command: ["up", "--yes"]
